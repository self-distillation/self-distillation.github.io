<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">A solution-conditioned teacher moves the student along two axes at once</title>
  <desc id="desc">A schematic update diagram. From the student, an attractive step points toward a concise and confident positive teacher conditioned on a correct solution, while a repulsive step moves toward verbalized uncertainty and away from a negative teacher conditioned on an incorrect solution. Their shared reasoning-style effects cancel, leaving a correctness update.</desc>
  <style>
    text { font-family: Inter, Helvetica, Arial, sans-serif; fill: #30302d; }
  </style>

  <rect width="760" height="560" fill="#fff"/>

  <defs>
    <marker id="ch-hd-green" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="7.8" refX="10.5" refY="3.9" orient="auto"><path d="M0,0 L11,3.9 L0,7.8 Z" fill="#A7C66B"/></marker>
    <marker id="ch-hd-red" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="7.8" refX="10.5" refY="3.9" orient="auto"><path d="M0,0 L11,3.9 L0,7.8 Z" fill="#E47B71"/></marker>
    <marker id="ch-hd-teal" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="9.2" refX="12.4" refY="4.6" orient="auto"><path d="M0,0 L13,4.6 L0,9.2 Z" fill="#65B5A6"/></marker>
    <marker id="ch-hd-green-s" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="5" refX="6.7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5 Z" fill="#A7C66B"/></marker>
    <marker id="ch-hd-red-s" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="5" refX="6.7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5 Z" fill="#E47B71"/></marker>
    <marker id="ch-hd-axis" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="8.6" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#30302D"/></marker>
    <marker id="ch-hd-axis-r" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="6.4" refX="0.4" refY="3.2" orient="auto"><path d="M9,0 L0,3.2 L9,6.4 Z" fill="#30302D"/></marker>  </defs>

  <g fill="none" stroke="#30302D" stroke-width="1.6" marker-start="url(#ch-hd-axis-r)" marker-end="url(#ch-hd-axis)">
    <path d="M40,300 H730"/>
    <path d="M300,40 V500"/>
  </g>

  <g fill="none" stroke="#DDD8CC" stroke-width="0.75">
    <path d="M475,152 V448" stroke-dasharray="4 5"/>
    <path d="M300,152 H475" stroke-dasharray="4 5"/>
    <path d="M300,448 H475" stroke-dasharray="4 5"/>
    <path d="M388,146 V158"/>
    <path d="M388,442 V454"/>
  </g>

  <path d="M466.6,438.9 L308.4,304.9" fill="none" stroke="#E47B71" stroke-width="0.75" stroke-dasharray="3 5" stroke-opacity="0.55"/>

  <!-- Repulsion only specifies "not the negative teacher": a fan of directions qualifies,
       all sharing the same leftward behavioral component but differing in correctness. -->
  <path d="M300,300 L202.2,312.5 A98.6,98.6 0 0,1 296.0,201.5 Z" fill="#E47B71" fill-opacity="0.13"/>

  <path d="M307.6,293.5 L374.9,236.7" fill="none" stroke="#A7C66B" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ch-hd-green)"/>
  <path d="M292.4,293.5 L225.1,236.7" fill="none" stroke="#E47B71" stroke-width="2.4" stroke-linecap="round" marker-end="url(#ch-hd-red)"/>
  <path d="M300.0,290.0 L300.0,168.5" fill="none" stroke="#65B5A6" stroke-width="3" stroke-linecap="round" marker-end="url(#ch-hd-teal)"/>

  <g fill="none" stroke-width="0.75" stroke-dasharray="3 5" stroke-opacity="0.55">
    <path d="M379.5,232.8 L300.0,162.5" stroke="#A7C66B"/>
    <path d="M220.5,232.8 L300.0,162.5" stroke="#E47B71"/>
  </g>

  <circle cx="300" cy="300" r="5" fill="#fff" stroke="#30302D" stroke-width="1.5"/>
  <circle cx="475" cy="152" r="5.5" fill="#fff" stroke="#A7C66B" stroke-width="1.5"/>
  <circle cx="475" cy="448" r="5.5" fill="#fff" stroke="#E47B71" stroke-width="1.5"/>

  <g>
    <text x="491" y="148" font-size="14" font-weight="500" fill="#78964A">positive teacher</text>
    <text x="491" y="167" font-size="12" font-style="italic" fill="#7C7973">conditioned on a correct solution</text>
    <text x="491" y="444" font-size="14" font-weight="500" fill="#C85E55">negative teacher</text>
    <text x="491" y="463" font-size="12" font-style="italic" fill="#7C7973">conditioned on an incorrect solution</text>
    <text x="286" y="325" font-size="14" font-weight="500" fill="#30302D" text-anchor="end">student</text>
    <text x="310" y="56" font-size="12" font-style="italic" fill="#7C7973">correct answer</text>
    <text x="310" y="492" font-size="12" font-style="italic" fill="#7C7973">incorrect answer</text>
    <text x="40" y="290" font-size="12" font-style="italic" fill="#7C7973">verbalized uncertainty</text>
    <text x="730" y="290" font-size="12" font-style="italic" fill="#7C7973" text-anchor="end">concise and confident</text>
    <text x="730" y="326" font-size="13" font-weight="600" fill="#30302D" text-anchor="end">behavioral shift</text>
    <text x="284" y="40" font-size="13" font-weight="600" fill="#30302D" text-anchor="end" transform="rotate(-90 284 40)">correctness</text>
  </g>

  <g>
    <path d="M306,516 H372" fill="none" stroke="#A7C66B" stroke-width="0.75" marker-end="url(#ch-hd-green-s)"/>
    <path d="M294,516 H228" fill="none" stroke="#E47B71" stroke-width="0.75" marker-end="url(#ch-hd-red-s)"/>
    <text x="300" y="538" font-size="12" fill="#7C7973" text-anchor="middle">a contrastive objective cancels the behavioral shifts</text>
  </g>
</svg>
