<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="cso-title cso-desc">
  <title id="cso-title">Contrastive preferences on a fixed student answer</title>
  <desc id="cso-desc">The fixed student answer 2 plus 2 equals 5 sits between a correct-answer row and an incorrect-answer row. Both teacher rows prefer Final answer in green and dislike Let me think in red, while the correct-answer teacher also corrects the final 5 to 4. In the complete contrastive state shown here, attraction follows the correct teacher and repulsion reverses the incorrect teacher, so their shared behavioral preference is faded as cancelled while the correction from 5 to 4 remains emphasized. Accuracy and response-length plots compare all three objectives.</desc>
  <style>
    text { font-family: Inter, Helvetica, Arial, sans-serif; fill: #30302d; }
    .mono { font-family: Inconsolata, Menlo, Consolas, monospace; }
    .muted { fill: #77746e; }
    .micro { font-size: 7px; }
    .tiny { font-size: 9px; }
    .axis-progress { font-size: 11px; }
    .small { font-size: 10px; }
    .node { stroke-width: 1; }
    .axis { fill: none; stroke: #aaa69f; stroke-width: 1; }
    .curve { fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    .link { fill: none; stroke: #c9c9c3; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .cap { fill: none; stroke: #aaa69f; stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
  </style>
  <rect width="960" height="360" fill="#fff"/>

  <text x="20" y="24" class="tiny muted" letter-spacing="1">VISUAL ABSTRACT</text>
  <text x="142" y="25" font-family="Palatino, Georgia, serif" font-size="18" fill="#3e8f80">Contrastive Self-Distillation</text>
  <line x1="20" y1="36" x2="940" y2="36" stroke="#ddd8cc"/>

  <!-- Correct-answer row: its behavioral assignments are faded as cancelled. -->
  <g>
    <rect class="node" x="20" y="61" width="88" height="54" rx="5" fill="#f5f8ee" stroke="#b6cd88"/>
    <text x="26" y="70" class="micro" font-weight="600" fill="#718c3e" letter-spacing=".2" opacity=".72">CONTEXT</text>
    <text x="64" y="86" class="tiny" font-weight="600" fill="#718c3e" text-anchor="middle" letter-spacing=".5">CORRECT</text>
    <text x="64" y="98" class="tiny" font-weight="600" fill="#718c3e" text-anchor="middle" letter-spacing=".5">ANSWER</text>

    <rect x="234" y="48" width="312" height="74" rx="9" fill="none" stroke="#cbdbaa"/>
    <rect x="240" y="45" width="111" height="12" fill="#fff"/>
    <text x="243" y="53" class="micro" font-weight="600" fill="#718c3e" letter-spacing=".25">ATTRACTIVE TEACHER SIGNAL</text>

    <g opacity=".22">
      <rect class="node" x="242" y="65" width="90" height="46" rx="5" fill="#f1f7e5" stroke="#a7c66b"/>
      <text x="287" y="92" class="small" font-weight="600" fill="#718c3e" text-anchor="middle">Final answer</text>
      <path class="link" d="M287 143V111"/>

      <rect class="node" x="342" y="65" width="90" height="46" rx="5" fill="#fbeae8" stroke="#e47b71"/>
      <text x="387" y="92" class="small" font-weight="600" fill="#bd5149" text-anchor="middle">Let me think</text>
      <path class="link" d="M287 143V127C287 120 299 116 311 116H375C382 116 387 114 387 111"/>
    </g>

    <rect class="node" x="488" y="65" width="46" height="46" rx="5" fill="#e7f3f0" stroke="#65b5a6"/>
    <rect x="488" y="108" width="46" height="3" fill="#65b5a6"/>
    <text x="511" y="93" class="mono" font-size="14" font-weight="600" fill="#3e8f80" text-anchor="middle">4</text>
    <line x1="511" y1="111" x2="511" y2="143" stroke="#65b5a6" stroke-width="1.2"/>
  </g>

  <!-- Fixed student answer. -->
  <g>
    <rect x="252" y="138" width="294" height="75" rx="9" fill="#f6f6f3"/>
    <text x="258" y="147" class="micro muted" font-weight="600" letter-spacing=".45">STUDENT GENERATION</text>
    <rect class="node" x="114" y="151" width="126" height="54" rx="5" fill="#f5f9fc" stroke="#a9c9e7"/>
    <text x="120" y="160" class="micro" font-weight="600" fill="#537b9e" letter-spacing=".2" opacity=".72">PROMPT</text>
    <text x="177" y="185" class="small" text-anchor="middle">What is 2 + 2?</text>
    <rect class="node" x="260" y="151" width="54" height="54" rx="5" fill="#edf5fb" stroke="#a9c9e7"/>
    <text x="287" y="183" class="mono" font-size="14" font-weight="600" text-anchor="middle">2</text>
    <rect class="node" x="322" y="151" width="42" height="54" rx="5" fill="#edf5fb" stroke="#a9c9e7"/>
    <text x="343" y="183" class="mono" font-size="14" font-weight="600" text-anchor="middle">+</text>
    <rect class="node" x="372" y="151" width="54" height="54" rx="5" fill="#edf5fb" stroke="#a9c9e7"/>
    <text x="399" y="183" class="mono" font-size="14" font-weight="600" text-anchor="middle">2</text>
    <rect class="node" x="434" y="151" width="42" height="54" rx="5" fill="#edf5fb" stroke="#a9c9e7"/>
    <text x="455" y="183" class="mono" font-size="14" font-weight="600" text-anchor="middle">=</text>
    <rect class="node" x="484" y="151" width="54" height="54" rx="5" fill="#f9e7e5" stroke="#e4a09a"/>
    <rect x="484" y="202" width="54" height="3" fill="#e47b71"/>
    <text x="511" y="183" class="mono" font-size="14" font-weight="600" text-anchor="middle">5</text>
  </g>

  <!-- Incorrect-answer row: the opposing behavioral assignments are faded. -->
  <g>
    <rect class="node" x="20" y="241" width="88" height="54" rx="5" fill="#fcf3f1" stroke="#e9a6a0"/>
    <text x="26" y="250" class="micro" font-weight="600" fill="#bd5149" letter-spacing=".2" opacity=".72">CONTEXT</text>
    <text x="64" y="266" class="tiny" font-weight="600" fill="#bd5149" text-anchor="middle" letter-spacing=".5">INCORRECT</text>
    <text x="64" y="278" class="tiny" font-weight="600" fill="#bd5149" text-anchor="middle" letter-spacing=".5">ANSWER</text>

    <rect x="234" y="228" width="206" height="74" rx="9" fill="none" stroke="#efc0bb"/>
    <rect x="240" y="293" width="108" height="12" fill="#fff"/>
    <text x="243" y="301" class="micro" font-weight="600" fill="#bd5149" letter-spacing=".25">REPULSIVE TEACHER SIGNAL</text>

    <g opacity=".22">
      <rect class="node" x="242" y="239" width="90" height="46" rx="5" fill="#f1f7e5" stroke="#a7c66b"/>
      <text x="287" y="266" class="small" font-weight="600" fill="#718c3e" text-anchor="middle">Final answer</text>
      <path class="link" d="M287 205V239"/>

      <rect class="node" x="342" y="239" width="90" height="46" rx="5" fill="#fbeae8" stroke="#e47b71"/>
      <text x="387" y="266" class="small" font-weight="600" fill="#bd5149" text-anchor="middle">Let me think</text>
      <path class="link" d="M287 205V213C287 222 299 226 311 226H375C382 226 387 232 387 239"/>
    </g>
  </g>

  <!-- Mini-plots with all three qualitative trajectories. -->
  <g transform="translate(620 52)">
    <text x="0" y="8" class="tiny muted">Accuracy</text>
    <path class="axis" d="M15 22V112H315"/>
    <path class="curve" d="M15 72C120 71 230 58 305 50" stroke="#718c3e" opacity=".72"/>
    <path class="curve" d="M15 72C76 78 118 65 153 38C184 22 210 41 221 72C233 106 268 109 305 109" stroke="#bd5149" opacity=".72"/>
    <path class="curve" d="M15 72C93 65 185 45 305 26" stroke="#3e8f80"/>
  </g>

  <g transform="translate(620 188)">
    <text x="0" y="8" class="tiny muted">Response length</text>
    <path class="axis" d="M15 22V112H315"/>
    <path class="cap" d="M15 23H305"/>
    <text x="305" y="18" class="axis-progress muted" text-anchor="end">response cap</text>
    <path class="curve" d="M15 72C91 72 194 80 305 88" stroke="#718c3e" opacity=".72"/>
    <path class="curve" d="M15 72C92 70 135 68 170 47C201 21 251 22 305 23" stroke="#bd5149" opacity=".72"/>
    <path class="curve" d="M15 72C95 72 190 64 305 56" stroke="#3e8f80"/>
    <text x="165" y="128" class="axis-progress muted" text-anchor="middle">training progress</text>
  </g>

  <g transform="translate(390 329)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#718c3e" stroke-width="2.5"/>
    <text x="24" y="3" class="tiny muted">Attractive Self-Distillation</text>
    <line x1="170" y1="0" x2="188" y2="0" stroke="#bd5149" stroke-width="2.5"/>
    <text x="194" y="3" class="tiny muted">Repulsive Self-Distillation</text>
    <line x1="336" y1="0" x2="354" y2="0" stroke="#3e8f80" stroke-width="2.5"/>
    <text x="360" y="3" class="tiny muted">Contrastive Self-Distillation</text>
  </g>
</svg>
